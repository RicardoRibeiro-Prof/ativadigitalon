name: Add Iago portfolio card
on:
  push:
    paths:
      - '.github/workflows/add-iago-portfolio.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add portfolio card
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          slug='demos/clinica-iago-barradas/'
          if slug not in text:
              card='''      <a class="project reveal" href="https://ativadigitalon.com.br/demos/clinica-iago-barradas/" target="_blank" rel="noopener noreferrer"><div class="project-img"><img src="data:image/svg+xml;base64," alt="Demonstração Clínica Dr. Iago Barradas" width="1200" height="774" loading="lazy"><span>Odontologia</span></div><div class="project-copy"><small>Odontologia</small><h3>Clínica Dr. Iago Barradas</h3><p>Página premium para apresentar a clínica, tratamentos e conduzir pacientes ao agendamento.</p><b>Ver projeto <span>↗</span></b></div></a>\n'''
              marker='    </div><p class="portfolio-note">'
              text=text.replace(marker,card+marker,1)
              p.write_text(text,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Adicionar Clínica Dr. Iago Barradas ao portfólio"
          git push