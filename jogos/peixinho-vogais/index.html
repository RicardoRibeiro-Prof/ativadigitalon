<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peixinho das Vogais 🐠</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Trebuchet MS',sans-serif;background:#e2faff;color:#15375c}button{font:inherit;cursor:pointer;touch-action:manipulation}.wrap{max-width:1040px;margin:auto;padding:12px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:6px 0;font-size:clamp(22px,4vw,37px);color:#117eaa}.pill{border:3px solid #8de4ed;background:white;padding:8px 14px;border-radius:25px;font-weight:900}.sea{position:relative;height:min(68vh,630px);min-height:460px;overflow:hidden;border:6px solid white;border-radius:28px;background:linear-gradient(#70e4ff,#1a9cd4 38%,#09609c 88%);box-shadow:0 9px 0 #aed9eb,0 18px 24px #1378b83b}.light{position:absolute;inset:0;background:repeating-linear-gradient(106deg,#ffffff16 0 20px,transparent 24px 135px);clip-path:polygon(0 0,100% 0,75% 100%,0 100%);pointer-events:none}.bubble{position:absolute;border:2px solid #ddffff9c;border-radius:50%;animation:rise 9s linear infinite;pointer-events:none}@keyframes rise{from{transform:translateY(80px);opacity:0}20%{opacity:.9}to{transform:translateY(-700px);opacity:0}}.floor{position:absolute;bottom:0;width:100%;height:83px;background:#e6ce90;border-radius:50% 50% 0 0/26px 26px 0 0}.plant{position:absolute;bottom:48px;font-size:62px;opacity:.84}.fish{position:absolute;left:4%;top:44%;font-size:clamp(56px,9vw,105px);filter:drop-shadow(1px 6px 4px #004e7388);animation:swim 4s ease-in-out infinite;z-index:2;pointer-events:none}@keyframes swim{50%{transform:translate(24px,-22px) rotate(-6deg)}}.speech{position:absolute;top:15px;left:50%;transform:translateX(-50%);width:min(92%,730px);z-index:4;background:#fff;border:4px solid #ffdb65;border-radius:23px;padding:14px;text-align:center;box-shadow:0 7px 0 #0092ad;font-weight:1000;font-size:clamp(19px,3vw,31px)}.answers{position:absolute;top:49%;left:50%;transform:translate(-50%,-50%);display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(4px,1.2vw,16px);width:min(92%,760px);z-index:3}.shell{border:0;background:none;position:relative;min-height:115px;transition:transform .15s;animation:float 3.8s ease-in-out infinite;animation-delay:var(--delay)}.shell:hover{transform:scale(1.07)}.shell:active{transform:scale(.93)}@keyframes float{50%{translate:0 -12px}}.shell .shape{font-size:clamp(52px,8.3vw,93px);filter:drop-shadow(0 7px 3px #003d5970);display:block;line-height:1.1}.shell .letter{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);font-weight:1000;font-size:clamp(35px,6vw,66px);color:#1e5279;-webkit-text-stroke:1px white;text-shadow:1px 3px white}.shell:disabled{opacity:.35}.shell.good .letter{color:#06a55c}.shell.bad .letter{color:#f1456a}.status{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);z-index:3;color:#fff;text-shadow:0 3px #00527d;font-size:clamp(21px,3vw,29px);font-weight:1000;text-align:center;width:90%;min-height:45px}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:17px}.btn{background:#ffbd3b;color:#493400;font-weight:1000;font-size:19px;border:0;border-bottom:5px solid #c77d14;border-radius:18px;padding:15px 20px}.btn.alt{background:white;border:3px solid #6fc7e5;color:#165583}.btn:disabled{opacity:.5}.fish.win{animation:celebrate .6s ease-in-out 2}@keyframes celebrate{50%{transform:translate(110px,-75px) rotate(-25deg)}}.star{position:absolute;z-index:5;font-size:40px;pointer-events:none;animation:spark 1.3s ease-out forwards}@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(140deg);opacity:0}}.help{text-align:center;color:#4e728b;font-size:14px;margin-top:15px}@media(max-width:560px){.sea{min-height:490px}.answers{grid-template-columns:repeat(3,1fr);top:53%;width:95%;gap:0}.shell{min-height:100px}.fish{top:27%;left:5%;font-size:62px}.speech{padding:11px;min-height:80px}.status{bottom:14px}.plant{font-size:40px}}
</style></head><body><main class="wrap"><header><h1>🐠 Peixinho das Vogais</h1><span class="pill">⭐ Estrelas: <span id="score">0</span></span></header><section class="sea" id="sea" aria-label="Jogo de vogais no fundo do mar"><div class="light"></div><div id="bubbles"></div><div class="speech" id="prompt" aria-live="polite">Olá! Ajude o peixinho a encontrar as vogais!</div><div class="fish" id="fish">🐠</div><div class="answers" id="answers"></div><div class="floor"></div><span class="plant" style="left:2%">🌿</span><span class="plant" style="right:4%">🪸</span><span class="plant" style="left:27%">🌱</span><div class="status" id="status"></div></section><div class="controls"><button class="btn" id="start">▶ COMEÇAR A AVENTURA</button><button class="btn alt" id="repeat">🔊 OUVIR DE NOVO</button><button class="btn alt" id="sound">🔊 SOM LIGADO</button></div><p class="help">Feito para crianças pequenas: letras grandes, sem tempo limite e com novas tentativas.</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),letters=['A','E','I','O','U'];let score=0,target='A',playing=false,locked=false,sound=true,round=0,voice=null;const voiced={A:'á',E:'é',I:'i',O:'ó de óculos',U:'u'};function selectVoice(){if(!('speechSynthesis'in window))return;const v=speechSynthesis.getVoices();voice=v.find(x=>/^pt-BR$/i.test(x.lang)&&/Google|Francisca|Natural|Microsoft/i.test(x.name))||v.find(x=>/^pt-BR$/i.test(x.lang))||v.find(x=>/^pt/i.test(x.lang))||null}if('speechSynthesis'in window){selectVoice();speechSynthesis.addEventListener?.('voiceschanged',selectVoice)}function speak(s){if(!sound||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();selectVoice();const u=new SpeechSynthesisUtterance(s);u.lang='pt-BR';if(voice)u.voice=voice;u.rate=.78;u.pitch=1.05;speechSynthesis.speak(u)}catch(e){}}function beep(ok){if(!sound)return;try{const a=new(window.AudioContext||window.webkitAudioContext)();(ok?[523,659,784]:[310,260]).forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,a.currentTime+i*.12);g.gain.exponentialRampToValueAtTime(.13,a.currentTime+i*.12+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+i*.12+.21);o.start(a.currentTime+i*.12);o.stop(a.currentTime+i*.12+.22)});setTimeout(()=>a.close(),800)}catch(e){}}const instruction=()=>`Encontre a letra ${voiced[target]}. Cadê a letra ${voiced[target]}? Toque na conchinha!`;function draw(){const a=$('answers');a.innerHTML='';const order=[...letters].sort(()=>Math.random()-.5);for(const l of order){const b=document.createElement('button');b.className='shell';b.style.setProperty('--delay',(Math.random()*-4).toFixed(2)+'s');b.setAttribute('aria-label','Conchinha com a letra '+l);b.innerHTML='<span class="shape" aria-hidden="true">🐚</span><span class="letter">'+l+'</span>';b.onclick=()=>choose(l,b);a.append(b)}}function next(){round++;target=letters[(round-1)%5];if(round%5===1&&round>1)target=letters[Math.floor(Math.random()*5)];locked=false;playing=true;$('prompt').textContent='🐚 Cadê a letra '+target+'?';$('status').textContent='Toque na conchinha certa!';$('fish').classList.remove('win');$('start').textContent='➡ PRÓXIMA RODADA';draw();speak(instruction())}function fireworks(){const sea=$('sea');for(let i=0;i<12;i++){const s=document.createElement('span');s.className='star';s.textContent=i%3===0?'💖':'⭐';s.style.left=(35+Math.random()*35)+'%';s.style.top=(38+Math.random()*22)+'%';s.style.setProperty('--dx',(Math.random()*360-180)+'px');s.style.setProperty('--dy',(Math.random()*-250-45)+'px');sea.append(s);setTimeout(()=>s.remove(),1300)}}function choose(l,b){if(!playing||locked)return;if(l===target){locked=true;score++;$('score').textContent=score;b.classList.add('good');$('fish').classList.add('win');$('prompt').textContent='🎉 Isso! Você encontrou a letra '+target+'!';$('status').textContent='Muito bem! ⭐';beep(true);fireworks();speak('Muito bem! Você encontrou a letra '+voiced[target]+'!');$('start').textContent='➡ PRÓXIMA RODADA'}else{b.classList.add('bad');b.disabled=true;$('status').textContent='💙 Vamos tentar outra conchinha!';beep(false);speak('Quase! Procure a letra '+voiced[target]+'.')}}$('start').onclick=next;$('repeat').onclick=()=>speak(playing?instruction():'Olá! Vamos brincar de encontrar vogais?');$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 SOM LIGADO':'🔇 SOM DESLIGADO';if(!sound&&'speechSynthesis'in window)speechSynthesis.cancel()};const bg=$('bubbles');for(let i=0;i<21;i++){const e=document.createElement('div');e.className='bubble';const n=7+Math.random()*26;e.style.width=e.style.height=n+'px';e.style.left=Math.random()*100+'%';e.style.bottom=Math.random()*100+'px';e.style.animationDelay=(-Math.random()*12)+'s';e.style.animationDuration=(7+Math.random()*8)+'s';bg.append(e)}})();
</script></body></html>
