<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trenzinho das Vogais</title><style>
:root{--blue:#17469b;--yellow:#ffd45a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Trebuchet MS',sans-serif;background:linear-gradient(#7ddcff 0%,#dcf8ff 69%,#8edc72 69%);color:#18345b;min-height:100vh;overflow-x:hidden}header{text-align:center;padding:18px 12px 6px}h1{margin:0;color:#153a83;font-size:clamp(27px,5vw,48px);text-shadow:2px 3px #fff}header p{margin:4px 0;font-weight:700}.hud{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin:12px}.pill{border-radius:99px;background:white;padding:9px 17px;font-weight:900;box-shadow:0 4px 0 #a6b9d1}.scene{position:relative;width:min(1100px,96vw);height:clamp(280px,39vw,410px);margin:0 auto;overflow:hidden;border-radius:22px;background:linear-gradient(#83d9fe,#d5f5ff 72%,#75c85c 72%);box-shadow:0 10px 26px #17469b30}.sun{position:absolute;right:9%;top:25px;border-radius:50%;width:76px;height:76px;background:#ffe25c;box-shadow:0 0 0 14px #ffe25c55}.cloud{position:absolute;top:45px;font-size:66px;opacity:.9;animation:cloud 16s linear infinite}.cloud.two{top:100px;left:50%;animation-duration:22s}.hill{position:absolute;bottom:72px;width:440px;height:115px;background:#67b950;border-radius:50% 50% 0 0;left:-50px}.hill.b{left:53%;height:95px;background:#51ae53}.track{position:absolute;bottom:18px;left:0;right:0;height:37px;background:repeating-linear-gradient(90deg,#7b5434 0 17px,#d9ab75 17px 30px);border-top:8px solid #3d4356;border-bottom:8px solid #3d4356}.train{position:absolute;bottom:54px;left:0;display:flex;align-items:end;gap:7px;transform:translateX(-115%);will-change:transform}.train.moving{animation:ride 8s linear infinite}.engine{width:155px;height:122px;position:relative;flex-shrink:0}.engine-base{position:absolute;bottom:14px;left:0;width:150px;height:76px;background:#eb434f;border:5px solid #a42232;border-radius:16px 20px 8px 8px}.engine-cab{position:absolute;bottom:73px;left:76px;width:70px;height:48px;background:#f9c34e;border:5px solid #b57e1c;border-radius:12px}.window{width:31px;height:26px;border-radius:6px;background:#9de8fd;margin:6px auto}.chimney{position:absolute;bottom:88px;left:21px;width:28px;height:32px;background:#253c72;border-radius:5px}.nose{position:absolute;bottom:14px;left:0;width:28px;height:45px;border-radius:6px;background:#ffac35}.wheel{position:absolute;bottom:0;width:34px;height:34px;background:#283e67;border:7px solid #a8bed7;border-radius:50%}.engine .wheel.a{left:25px}.engine .wheel.b{left:103px}.car{position:relative;flex-shrink:0;height:104px;width:115px;border-radius:15px 15px 8px 8px;background:var(--c);border:5px solid #ffffffaa;box-shadow:inset 0 -12px #0002;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;text-shadow:2px 3px #173761;cursor:pointer}.car strong{font-size:60px;line-height:1}.car small{font-weight:900;color:#fff}.car:after{content:'';position:absolute;right:-13px;bottom:25px;width:12px;height:10px;background:#344766}.car .wheel{bottom:-20px;width:28px;height:28px;border-width:6px}.car .wheel.a{left:10px}.car .wheel.b{right:10px}.controls{text-align:center;margin:18px 10px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button{border:none;cursor:pointer;font-family:inherit;font-weight:900;border-radius:18px;padding:14px 22px;font-size:clamp(16px,2.5vw,22px);background:#ffd34e;color:#29345b;box-shadow:0 5px 0 #d69720;touch-action:manipulation}button:active{transform:translateY(4px);box-shadow:0 1px 0 #d69720}button.secondary{background:#e9f2ff;box-shadow:0 5px 0 #9ab9ed}.panel{background:#fffef4;border:5px solid #fff;border-radius:26px;box-shadow:0 12px 30px #163c6533;width:min(720px,95vw);margin:12px auto 40px;padding:20px;text-align:center}.panel h2{font-size:clamp(23px,4vw,32px);margin:0 0 6px}.big{font-size:clamp(66px,11vw,108px);line-height:1.25}.prompt{font-size:clamp(19px,3vw,25px);font-weight:850;margin:5px 0 15px}.choices{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.choices button{width:clamp(52px,12vw,84px);padding:12px 0;font-size:34px;color:#fff;background:var(--c);box-shadow:0 5px 0 #15305c66}.feedback{min-height:35px;margin:15px 0 0;font-size:23px;font-weight:900}.good{color:#169142}.bad{color:#cf3e4a}.hidden{display:none}.tip{font-size:13px;color:#456;text-align:center;padding-bottom:15px}@keyframes ride{from{transform:translateX(-110%)}to{transform:translateX(120%)}}@keyframes cloud{from{transform:translateX(-90px)}to{transform:translateX(1100px)}}@media(max-width:600px){.scene{height:320px}.train{transform-origin:left bottom;scale:.66}.train.moving{animation:rideMobile 8s linear infinite}@keyframes rideMobile{from{transform:translateX(-180%)}to{transform:translateX(155%)}}.panel{padding:16px 10px}}
</style></head><body><header><h1>🚂 Trenzinho das Vogais</h1><p>Uma viagem divertida com A, E, I, O, U!</p></header><div class="hud"><span class="pill">⭐ Acertos: <span id="score">0</span></span><span class="pill">🎯 Rodada: <span id="round">1</span></span></div><main><div class="scene" aria-label="Trenzinho colorido viajando pelos trilhos"><div class="sun"></div><div class="cloud">☁️</div><div class="cloud two">☁️</div><div class="hill"></div><div class="hill b"></div><div class="track"></div><div class="train moving" id="train"><div class="engine"><div class="chimney"></div><div class="engine-cab"><div class="window"></div></div><div class="engine-base"></div><div class="nose"></div><div class="wheel a"></div><div class="wheel b"></div></div><div class="car" data-letter="A" style="--c:#e94e6b"><strong>A</strong><small>AVIÃO</small><div class="wheel a"></div><div class="wheel b"></div></div><div class="car" data-letter="E" style="--c:#ffab2f"><strong>E</strong><small>ELEFANTE</small><div class="wheel a"></div><div class="wheel b"></div></div><div class="car" data-letter="I" style="--c:#50b66a"><strong>I</strong><small>IGREJA</small><div class="wheel a"></div><div class="wheel b"></div></div><div class="car" data-letter="O" style="--c:#528be0"><strong>O</strong><small>OVELHA</small><div class="wheel a"></div><div class="wheel b"></div></div><div class="car" data-letter="U" style="--c:#a668de"><strong>U</strong><small>UVA</small><div class="wheel a"></div><div class="wheel b"></div></div></div></div><div class="controls"><button id="go">🚉 Parar na estação!</button><button class="secondary" id="sound">🔊 Som ligado</button></div><section class="panel" id="panel"><h2 id="title">Vamos aprender as vogais?</h2><div class="big" id="picture">🚂</div><p class="prompt" id="prompt">Observe o trenzinho e toque em “Parar na estação!”</p><div class="choices hidden" id="choices"></div><p class="feedback" id="feedback" aria-live="polite"></p><button id="again" class="secondary hidden">🚂 Próxima estação</button></section></main><p class="tip">Dica: toque nos vagões para ouvir suas vogais. Funciona também no celular.</p><script>
(()=>{'use strict';const data=[{l:'A',word:'AVIÃO',icon:'✈️'},{l:'A',word:'ABELHA',icon:'🐝'},{l:'A',word:'ARANHA',icon:'🕷️'},{l:'E',word:'ELEFANTE',icon:'🐘'},{l:'E',word:'ESTRELA',icon:'⭐'},{l:'E',word:'ESCOVA',icon:'🪥'},{l:'I',word:'IGREJA',icon:'⛪'},{l:'I',word:'ILHA',icon:'🏝️'},{l:'I',word:'ÍMÃ',icon:'🧲'},{l:'O',word:'OVELHA',icon:'🐑'},{l:'O',word:'OVO',icon:'🥚'},{l:'O',word:'OLHO',icon:'👁️'},{l:'U',word:'UVA',icon:'🍇'},{l:'U',word:'URSO',icon:'🐻'},{l:'U',word:'UNICÓRNIO',icon:'🦄'}];const $=id=>document.getElementById(id);let score=0,round=1,active=null,sound=true,finished=false;const colors=['#e94e6b','#ffab2f','#50b66a','#528be0','#a668de'];let audioCtx;function tone(freq=550){if(!sound)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.09,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.22);o.start();o.stop(audioCtx.currentTime+.23)}catch(e){}}function say(t){if(!sound||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=.78;u.pitch=1.12;window.speechSynthesis.speak(u)}function next(){finished=false;active=null;$('train').classList.add('moving');$('title').textContent='O trenzinho está passeando!';$('picture').textContent='🚂';$('prompt').textContent='Toque no botão para descobrir uma figura!';$('feedback').textContent='';$('choices').classList.add('hidden');$('again').classList.add('hidden');$('go').disabled=false;$('go').textContent='🚉 Parar na estação!';$('round').textContent=round}function station(){if(active)return;active=data[Math.floor(Math.random()*data.length)];$('train').classList.remove('moving');$('train').style.transform='translateX(-115%)';$('title').textContent='Quem chegou na estação?';$('picture').textContent=active.icon;$('prompt').textContent='Qual vogal começa o nome desta figura?';$('go').disabled=true;$('choices').replaceChildren();'AEIOU'.split('').forEach((l,i)=>{let b=document.createElement('button');b.textContent=l;b.style.setProperty('--c',colors[i]);b.setAttribute('aria-label','Vogal '+l);b.onclick=()=>answer(l);$('choices').appendChild(b)});$('choices').classList.remove('hidden');$('feedback').className='feedback';$('feedback').textContent='';tone(660);setTimeout(()=>say(active.word),250)}function answer(l){if(!active||finished)return;if(l===active.l){finished=true;score++;$('score').textContent=score;$('feedback').className='feedback good';$('feedback').textContent='🎉 Muito bem! '+active.word+' começa com '+l+'!';$('choices').classList.add('hidden');$('again').classList.remove('hidden');tone(880);setTimeout(()=>tone(1100),180);say('Muito bem! '+active.word+' começa com a vogal '+l);round++;}else{$('feedback').className='feedback bad';$('feedback').textContent='💛 Quase! Tente outra vogal!';tone(260);say('Vamos tentar de novo!')}}$('go').onclick=station;$('again').onclick=next;$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 Som ligado':'🔇 Som desligado';if(!sound&&'speechSynthesis'in window)window.speechSynthesis.cancel()};document.querySelectorAll('.car').forEach(c=>c.onclick=()=>say('Vogal '+c.dataset.letter));})();
</script></body></html>
