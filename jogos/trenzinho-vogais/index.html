<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trenzinho Mágico das Vogais</title>
<style>
:root{--ink:#173453;--sky:#b9eaff;--grass:#80d77d}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Trebuchet MS',sans-serif;background:#e7f8ff;color:var(--ink)}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #083de5;outline-offset:3px}.app{max-width:1080px;margin:auto;padding:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.brand{font-weight:1000;font-size:clamp(23px,4vw,42px);color:#2352b7;text-shadow:2px 3px white}.score{border:3px solid #ffce3c;background:#fff8cf;padding:9px 18px;border-radius:24px;font-weight:900;font-size:20px}.scene{border:5px solid white;border-radius:30px;overflow:hidden;position:relative;height:clamp(295px,46vw,445px);background:linear-gradient(#8edbff 0%,#d7f5ff 70%,#9ddb8b 70%);box-shadow:0 12px 0 #b5e3fa,0 15px 30px #6c9ec14d}.sun{position:absolute;top:24px;right:8%;width:65px;height:65px;background:#ffdc50;border-radius:50%;box-shadow:0 0 0 13px #fff6a650}.cloud{position:absolute;background:white;border-radius:100px;width:100px;height:32px;opacity:.9;animation:cloud 20s linear infinite}.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%;height:53px;width:53px;top:-20px;left:16px}.cloud:after{left:45px;top:-26px}.cloud.c1{top:90px;left:12%}.cloud.c2{top:40px;left:67%;animation-delay:-9s;transform:scale(.75)}@keyframes cloud{50%{translate:35px 0}}.hill{position:absolute;bottom:62px;border-radius:50% 50% 0 0;background:#51b85d;width:380px;height:115px;left:-80px}.hill.two{background:#68c66d;left:auto;right:-90px;width:420px;height:125px}.station{position:absolute;left:50%;bottom:91px;transform:translateX(-50%);width:120px;text-align:center;z-index:1}.roof{height:35px;background:#fb7654;clip-path:polygon(50% 0,100% 100%,0 100%)}.building{background:#fff7d2;border:5px solid #f6b457;border-radius:0 0 12px 12px;padding:13px 3px;font-weight:1000}.track{position:absolute;bottom:39px;left:0;right:0;height:12px;background:#414951;box-shadow:0 22px 0 #414951}.track:before{content:"";position:absolute;top:-6px;left:0;width:100%;height:40px;background:repeating-linear-gradient(90deg,transparent 0 36px,#986a47 37px 54px,transparent 55px 74px);z-index:0}.train{position:absolute;left:50%;bottom:56px;display:flex;align-items:end;gap:10px;width:max-content;z-index:3;transform:translateX(-50%);transition:transform 1.25s cubic-bezier(.24,.8,.2,1)}.train.moving{animation:ride 7s linear infinite;transition:none}@keyframes ride{0%{transform:translateX(70vw)}100%{transform:translateX(-140%)}}.loco{width:160px;height:118px;position:relative;flex-shrink:0}.engine{height:76px;background:#ed4348;border:6px solid #ac283f;border-radius:18px 25px 12px 12px;position:absolute;bottom:18px;left:3px;right:0;box-shadow:inset 0 8px #ff7e70}.cab{position:absolute;right:14px;top:-7px;width:65px;height:60px;border:6px solid #ac283f;border-radius:12px 12px 0 0;background:#fff2a2}.window{background:#83dbff;border:4px solid white;width:35px;height:29px;margin:8px auto;border-radius:8px}.chimney{position:absolute;left:18px;top:0;width:27px;height:35px;background:#474b78;border-radius:5px}.face{position:absolute;bottom:36px;left:14px;font-size:35px}.wagon{width:112px;height:102px;background:var(--c);border:5px solid #375375;border-radius:16px 16px 12px 12px;position:relative;flex-shrink:0;box-shadow:inset 0 7px #ffffff75,0 5px #273a64;display:flex;flex-direction:column;align-items:center;justify-content:center}.wagon:before{content:"";position:absolute;top:49px;left:-19px;width:18px;height:8px;background:#344258}.wagon .letter{font-size:49px;font-weight:1000;color:white;text-shadow:2px 4px #1a43586d;line-height:1}.wagon .mini{font-size:27px;line-height:1.1}.wheel{position:absolute;width:29px;height:29px;border-radius:50%;background:#303f64;border:7px solid #93a9c7;bottom:-19px;left:10px;box-shadow:60px 0 #303f64,60px 0 0 7px #93a9c7}.loco .wheel{bottom:5px;left:22px;box-shadow:92px 0 #303f64,92px 0 0 7px #93a9c7}.bubble{position:absolute;top:25px;left:50%;transform:translateX(-50%);z-index:4;background:white;border:3px solid #376bc7;border-radius:24px;padding:10px 17px;text-align:center;font-weight:900;font-size:clamp(16px,2.7vw,25px);max-width:90%;box-shadow:0 5px #77b0d8}.panel{margin:18px auto 0;background:white;border:4px solid #c8eafa;border-radius:26px;min-height:230px;padding:17px;text-align:center;box-shadow:0 7px 0 #c4e6f9}.bigbtn{border:0;border-bottom:6px solid #d77e13;background:#ffbc29;color:#583500;border-radius:20px;font-size:clamp(20px,3vw,30px);font-weight:1000;padding:17px 30px;min-width:240px}.bigbtn:active{transform:translateY(4px);border-bottom-width:2px}.sub{font-size:18px;color:#4d6580;margin:6px 0 18px;font-weight:700}.quiz{display:none}.quiz.on{display:block}.figure{font-size:clamp(72px,12vw,125px);line-height:1.15;filter:drop-shadow(0 7px #cde4f6)}.question{font-size:clamp(20px,3vw,31px);font-weight:1000;margin:5px 0 14px}.choices{display:flex;justify-content:center;gap:clamp(6px,1.5vw,18px);flex-wrap:wrap}.choice{border:0;border-bottom:6px solid #315ba8;background:#5689f2;color:white;width:clamp(55px,12vw,92px);height:clamp(64px,12vw,94px);font-size:clamp(32px,6vw,57px);font-weight:1000;border-radius:20px}.choice:active{transform:translateY(3px)}.choice:disabled{opacity:.4}.choice.correct{background:#27b765;border-color:#13834c;opacity:1}.choice.wrong{background:#f16c74;border-color:#a53d42}.feedback{min-height:44px;font-size:clamp(19px,3vw,26px);font-weight:1000;margin-top:12px}.next{display:none;margin:8px auto;background:#21bc83;color:white;border:0;border-bottom:5px solid #0d8658;padding:14px 25px;font-size:21px;font-weight:900;border-radius:18px}.volume{background:white;border:2px solid #a2c7e7;border-radius:15px;padding:8px 12px;font-weight:800}.help{font-size:14px;color:#597289;text-align:center;margin:16px} @media(max-width:690px){.train{scale:.64;transform-origin:center bottom;bottom:55px}.train.moving{animation:rideSmall 7s linear infinite}@keyframes rideSmall{from{transform:translateX(120vw)}to{transform:translateX(-200%)}}.bubble{top:16px}.station{bottom:78px}.scene{height:315px}.top{justify-content:center}.loco{margin-right:3px}}
</style></head>
<body><main class="app"><div class="top"><div class="brand">🚂 Trenzinho das Vogais</div><div class="score">⭐ Acertos: <span id="points">0</span></div><button class="volume" id="sound" aria-label="Ativar ou desativar som">🔊 Som ligado</button></div>
<section class="scene" aria-label="Trem de vogais animado"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="hill"></div><div class="hill two"></div><div class="station"><div class="roof"></div><div class="building">ESTAÇÃO<br>ABC</div></div><div class="bubble" id="bubble">Olá! Vamos viajar com as vogais?</div><div class="track"></div><div class="train moving" id="train"><div class="loco"><div class="chimney"></div><div class="cab"><div class="window"></div></div><div class="engine"><div class="face">😊</div></div><div class="wheel"></div></div><div class="wagon" style="--c:#ee6081"><div class="letter">A</div><div class="mini">🐝</div><div class="wheel"></div></div><div class="wagon" style="--c:#f4a334"><div class="letter">E</div><div class="mini">🐘</div><div class="wheel"></div></div><div class="wagon" style="--c:#54b99c"><div class="letter">I</div><div class="mini">🏝️</div><div class="wheel"></div></div><div class="wagon" style="--c:#7083e8"><div class="letter">O</div><div class="mini">🥚</div><div class="wheel"></div></div><div class="wagon" style="--c:#b574d4"><div class="letter">U</div><div class="mini">🍇</div><div class="wheel"></div></div></div></section>
<section class="panel"><div id="welcome"><h2>Pronto para a próxima estação?</h2><p class="sub">Quando o trem parar, descubra qual vogal começa o nome da figura!</p><button id="start" class="bigbtn">🚉 PARAR NA ESTAÇÃO</button></div><div id="quiz" class="quiz"><div class="figure" id="picture"></div><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><button id="next" class="next">🚂 PRÓXIMA VIAGEM →</button></div></section><p class="help">Jogo educativo gratuito • Ideal para alfabetização inicial • Funciona com toque e mouse</p></main>
<script>
(()=>{'use strict';const DATA=[['A','🐝','ABELHA'],['A','✈️','AVIÃO'],['A','🍍','ABACAXI'],['E','🐘','ELEFANTE'],['E','⭐','ESTRELA'],['E','🪥','ESCOVA'],['I','🏝️','ILHA'],['I','🧲','ÍMÃ'],['I','⛪','IGREJA'],['O','🥚','OVO'],['O','👂','ORELHA'],['O','🐑','OVELHA'],['U','🍇','UVA'],['U','🐻','URSO'],['U','💅','UNHA']];const $=id=>document.getElementById(id);let score=0,round=0,current=null,audioOn=true,busy=false;let deck=[];const shuffled=()=>[...DATA].sort(()=>Math.random()-.5);let selectedVoice=null;function chooseVoice(){if(!('speechSynthesis'in window))return;const vs=speechSynthesis.getVoices();selectedVoice=vs.find(v=>/^pt[-_]BR$/i.test(v.lang)&&/natural|google|microsoft|francisca|antonio/i.test(v.name))||vs.find(v=>/^pt[-_]BR$/i.test(v.lang))||vs.find(v=>/^pt/i.test(v.lang))||null}if('speechSynthesis'in window){chooseVoice();speechSynthesis.onvoiceschanged=chooseVoice}const pronounced={A:'á',E:'é',I:'i',O:'ó, de óculos',U:'u'};function speak(t){if(!audioOn||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();chooseVoice();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';if(selectedVoice)u.voice=selectedVoice;u.rate=.76;u.pitch=1.02;speechSynthesis.speak(u)}catch(e){}}function promptText(item){return item[2].toLowerCase()+'. Começa com a letra '+pronounced[item[0]]+'. Cadê a letra '+pronounced[item[0]]+'? Toque nela.'}function tone(good){if(!audioOn)return;try{const a=new(window.AudioContext||window.webkitAudioContext)();[0,1,2].forEach(i=>{const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.value=good?[523,659,784][i]:[280,220,180][i];g.gain.setValueAtTime(.0001,a.currentTime+i*.12);g.gain.exponentialRampToValueAtTime(.15,a.currentTime+i*.12+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+i*.12+.19);o.start(a.currentTime+i*.12);o.stop(a.currentTime+i*.12+.2)});setTimeout(()=>a.close(),900)}catch(e){}}function setMoving(yes){$('train').classList.toggle('moving',yes)}function newStation(){if(busy)return;busy=true;$('welcome').style.display='none';$('quiz').classList.remove('on');$('bubble').textContent='🚂 Piuí! Chegando à estação...';setMoving(true);if(!deck.length)deck=shuffled();current=deck.pop();setTimeout(()=>{setMoving(false);$('picture').textContent=current[1];$('question').textContent='Olha! '+current[2]+' começa com a letra '+current[0]+'. Cadê a letra '+current[0]+'?';$('choices').innerHTML='';$('feedback').textContent='';$('next').style.display='none';for(const l of 'AEIOU'){const b=document.createElement('button');b.className='choice';b.textContent=l;b.setAttribute('aria-label','Vogal '+l);b.onclick=()=>answer(l,b);$('choices').append(b)}$('quiz').classList.add('on');$('bubble').textContent='🎯 Escolha a vogal certa!';busy=false;speak(promptText(current))},1650)}function answer(letter,btn){if(busy)return;if(letter===current[0]){busy=true;btn.classList.add('correct');score++;$('points').textContent=score;round++;tone(true);$('feedback').textContent='🎉 Muito bem! '+current[2]+' começa com '+current[0]+'!';$('bubble').textContent='🌟 Parabéns! Você acertou!';Array.from($('choices').children).forEach(b=>b.disabled=true);$('next').style.display='block';setTimeout(()=>speak('Muito bem! '+current[2].toLowerCase()+' começa com a letra '+pronounced[current[0]]+'.'),500);busy=false}else{btn.classList.add('wrong');btn.disabled=true;tone(false);$('feedback').textContent='💛 Quase! Tente outra vogal.';speak('Tente outra vez. Procure a letra '+pronounced[current[0]]+'.')}}$('start').onclick=newStation;$('next').onclick=newStation;$('sound').onclick=()=>{audioOn=!audioOn;$('sound').textContent=audioOn?'🔊 Som ligado':'🔇 Som desligado';if(!audioOn&&'speechSynthesis'in window)speechSynthesis.cancel()};})();
</script></body></html>
