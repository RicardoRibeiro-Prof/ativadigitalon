<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Balões das Vogais 🎈</title><style>
*{box-sizing:border-box}body{margin:0;font-family:'Trebuchet MS',system-ui,sans-serif;background:#bfeeff;color:#183659;overflow-x:hidden}button{font:inherit;cursor:pointer;touch-action:manipulation}.app{max-width:950px;margin:auto;padding:12px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.logo{font-weight:1000;color:#2450a9;font-size:clamp(26px,4vw,43px);text-shadow:2px 3px white}.score{background:white;padding:10px 18px;border-radius:22px;border:3px solid #ffcc54;font-weight:900;font-size:22px}.stage{position:relative;height:min(68vh,620px);min-height:425px;border:6px solid white;border-radius:30px;overflow:hidden;background:linear-gradient(#73cfff 0%,#c7f1ff 76%,#d5f8b4 100%);box-shadow:0 10px 0 #93d8e9,0 16px 28px #469ac14d}.sun{position:absolute;right:55px;top:40px;width:76px;height:76px;border-radius:50%;background:#ffe373;box-shadow:0 0 0 15px #fff3b27a}.cloud{position:absolute;top:90px;left:8%;width:130px;height:38px;background:#fff;border-radius:100px;opacity:.88;animation:cloudmove 20s ease-in-out infinite alternate}.cloud:before,.cloud:after{content:"";position:absolute;left:17px;top:-20px;width:65px;height:65px;border-radius:50%;background:inherit}.cloud:after{left:62px;top:-28px;width:75px;height:75px}.cloud.two{left:65%;top:164px;scale:.72;animation-delay:-8s}@keyframes cloudmove{to{transform:translateX(65px)}}.hills{position:absolute;bottom:-80px;left:-10%;width:125%;height:145px;background:#74ce8b;border-radius:55% 55% 0 0}.topbar{position:absolute;z-index:20;left:50%;top:14px;transform:translateX(-50%);width:min(94%,700px);background:#fffdfa;border:4px solid #ffd25b;border-radius:24px;padding:12px;text-align:center;box-shadow:0 6px #f3b648}.prompt{font-size:clamp(20px,4vw,32px);font-weight:1000;line-height:1.2}.hint{font-size:14px;color:#63758a;margin-top:2px;font-weight:700}.voice{margin-top:8px;background:#e5f1ff;border:0;border-radius:15px;padding:7px 14px;color:#25529e;font-weight:900}.balloon{position:absolute;bottom:-200px;left:var(--x);width:clamp(74px,13vw,119px);height:clamp(100px,17vw,155px);border:0;background:transparent;display:flex;align-items:flex-start;justify-content:center;padding:0;z-index:5;animation:floatUp var(--duration) linear forwards;filter:drop-shadow(0 8px 3px #32789535)}.oval{display:flex;align-items:center;justify-content:center;width:100%;height:81%;background:radial-gradient(ellipse at 28% 22%,#ffffffb7 0%,#ffffff30 12%,transparent 34%),var(--c);border-radius:52% 52% 48% 48%;box-shadow:inset -12px -6px #0000001b,inset 3px 2px #ffffff65;position:relative}.oval:after{content:"";position:absolute;bottom:-9px;left:calc(50% - 8px);border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:0;border-top:15px solid var(--c)}.letter{font-size:clamp(44px,8.5vw,78px);font-weight:1000;color:white;text-shadow:0 4px 0 #263c6478}.string{position:absolute;height:45px;top:87%;left:49%;border-left:2px solid #7389a7;rotate:3deg}.balloon:focus-visible{outline:5px solid #1e60e8;border-radius:50%}.balloon.popped{animation:none!important;pointer-events:none}.balloon.popped .oval{animation:pop .23s ease-out forwards}.balloon.popped .string{display:none}@keyframes pop{to{scale:1.7;opacity:0}}@keyframes floatUp{from{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-420px) rotate(5deg)}to{transform:translateY(-900px) rotate(-4deg)}}.celebrate{position:absolute;z-index:30;top:52%;left:50%;translate:-50% -50%;background:white;border:5px solid #ffc431;border-radius:30px;padding:24px 32px;text-align:center;font-size:clamp(25px,5vw,48px);font-weight:1000;box-shadow:0 10px 30px #2d71944f;display:none;min-width:240px}.celebrate.visible{display:block;animation:zoom .35s ease-out}@keyframes zoom{from{scale:.5;opacity:0}to{scale:1;opacity:1}}.confetti{position:absolute;z-index:32;pointer-events:none;font-size:30px;animation:conf .9s ease-out forwards}@keyframes conf{to{translate:var(--dx) var(--dy);rotate:360deg;opacity:0}}.footer{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;margin:18px}.primary{border:0;border-bottom:6px solid #c77e13;background:#ffc343;color:#654017;border-radius:18px;font-size:22px;font-weight:1000;padding:13px 25px}.primary:active{transform:translateY(4px);border-bottom-width:2px}.setting{border:2px solid #85bae9;color:#25529e;background:#fff;border-radius:16px;padding:12px 15px;font-weight:900}.help{text-align:center;font-size:14px;color:#55748a;font-weight:700;margin:10px} @media(max-width:560px){.stage{min-height:480px;height:68vh}.balloon{width:66px;height:107px}.letter{font-size:46px}.topbar{padding:10px 5px}.logo{font-size:27px}.score{font-size:17px}.sun{right:20px;top:115px;width:50px;height:50px}}
</style></head><body><main class="app"><header class="header"><div class="logo">🎈 Balões das Vogais</div><div class="score">⭐ <span id="score">0</span> acertos</div></header><section class="stage" id="stage" aria-label="Jogo com balões coloridos subindo"><div class="sun"></div><div class="cloud"></div><div class="cloud two"></div><div class="hills"></div><div class="topbar"><div class="prompt" id="prompt">Vamos brincar com as vogais?</div><div class="hint" id="hint">Ouça a letra e estoure o balão certo!</div><button id="repeat" class="voice" type="button">🔊 Ouvir novamente</button></div><div class="celebrate" id="celebrate" aria-live="polite"></div></section><div class="footer"><button class="primary" id="start" type="button">▶️ COMEÇAR A BRINCAR</button><button class="setting" id="sound" type="button">🔊 Som ligado</button></div><p class="help">Toque no balão com a letra que ouvir. Feito para crianças pequenas.</p></main><script>
(()=>{'use strict';const $=x=>document.getElementById(x);const letters=['A','E','I','O','U'],colors=['#fa5a80','#f6a932','#4cbea3','#6886f4','#a965d5'];const names={A:'á',E:'é',I:'i',O:'ó',U:'u'};let playing=false,answer='A',points=0,timers=[],soundOn=true,voices=[],lastAsk=0;const stage=$('stage');function voicesLoad(){if(!('speechSynthesis'in window))return;voices=speechSynthesis.getVoices()}if('speechSynthesis'in window){voicesLoad();speechSynthesis.addEventListener?.('voiceschanged',voicesLoad)}function say(s){if(!soundOn||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='pt-BR';u.voice=voices.find(v=>/^pt-BR$/i.test(v.lang)&&/google|microsoft|natural|francisca/i.test(v.name))||voices.find(v=>/^pt-BR$/i.test(v.lang))||voices.find(v=>/^pt/i.test(v.lang))||null;u.rate=.72;u.pitch=1.03;speechSynthesis.speak(u)}catch(e){}}function playSound(ok){if(!soundOn)return;try{const ac=new(window.AudioContext||window.webkitAudioContext)();(ok?[520,660,800]:[230,185]).forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,ac.currentTime+i*.11);g.gain.exponentialRampToValueAtTime(.13,ac.currentTime+i*.11+.012);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+i*.11+.17);o.start(ac.currentTime+i*.11);o.stop(ac.currentTime+i*.11+.18)});setTimeout(()=>ac.close(),800)}catch(e){}}function ask(){const s='Estoure o balão da letra '+names[answer]+'. Cadê a letra '+names[answer]+'?';$('prompt').textContent='🎯 Estoure o balão da letra '+answer+'!';$('hint').textContent='Procure a letra '+answer+' nos balões';say(s);lastAsk=Date.now()}function clearTimers(){timers.forEach(clearTimeout);timers=[]}function stopBalloons(){stage.querySelectorAll('.balloon').forEach(b=>b.remove())}function spawn(){if(!playing)return;const width=stage.clientWidth,size=width<560?66:112;const margin=8;const columns=5;let list=[...letters];for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}list.forEach((l,i)=>{const b=document.createElement('button');b.className='balloon';b.type='button';b.setAttribute('aria-label','Balão da letra '+l);const x=(i+.12)*((width-size-margin)/columns)+margin;b.style.setProperty('--x',Math.max(0,Math.min(width-size,x))+'px');b.style.setProperty('--duration',(23+i%2*3)+'s');b.style.animationDelay=(i*.35)+'s';b.style.setProperty('--c',colors[letters.indexOf(l)]);b.innerHTML='<span class="oval"><span class="letter">'+l+'</span></span><span class="string"></span>';b.onclick=()=>touchBalloon(l,b);stage.append(b);b.addEventListener('animationend',()=>b.remove(),{once:true})})}function burst(b){const box=b.getBoundingClientRect(),s=stage.getBoundingClientRect();b.classList.add('popped');for(let i=0;i<12;i++){const p=document.createElement('span');p.className='confetti';p.textContent=['✨','⭐','🎉','💛'][i%4];p.style.left=(box.left-s.left+box.width/2)+'px';p.style.top=(box.top-s.top+box.height*.4)+'px';p.style.setProperty('--dx',(Math.random()*230-115)+'px');p.style.setProperty('--dy',(Math.random()*220-120)+'px');stage.append(p);setTimeout(()=>p.remove(),1000)}setTimeout(()=>b.remove(),230)}function touchBalloon(l,b){if(!playing||b.classList.contains('popped'))return;if(l!==answer){playSound(false);$('hint').textContent='Quase! Procure a letra '+answer+'.';say('Tente outra vez. Cadê a letra '+names[answer]+'?');return}playing=false;clearTimers();burst(b);playSound(true);points++;$('score').textContent=points;$('celebrate').textContent='🎉 Muito bem! Letra '+answer+'!';$('celebrate').classList.add('visible');say('Isso! Muito bem! Você encontrou a letra '+names[answer]+'!');timers.push(setTimeout(()=>{$('celebrate').classList.remove('visible');round()},2350))}let previous='';function round(){clearTimers();stopBalloons();let candidates=letters.filter(l=>l!==previous);answer=candidates[Math.floor(Math.random()*candidates.length)];previous=answer;playing=true;spawn();timers.push(setTimeout(ask,400));timers.push(setTimeout(function refresh(){if(!playing)return;spawn();timers.push(setTimeout(refresh,8200))},8200))}function start(){points=0;$('score').textContent='0';$('start').textContent='🔄 RECOMEÇAR';$('celebrate').classList.remove('visible');round()}$('start').onclick=start;$('repeat').onclick=()=>{if(playing)ask();else say('Vamos brincar? Aperte começar!')};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 Som ligado':'🔇 Som desligado';if(!soundOn&&'speechSynthesis'in window)speechSynthesis.cancel()};document.addEventListener('visibilitychange',()=>{if(document.hidden&&'speechSynthesis'in window)speechSynthesis.cancel()});})();
</script></body></html>
