<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monstrinho Faminto das Vogais</title><style>
*{box-sizing:border-box}body{margin:0;font-family:'Trebuchet MS',system-ui,sans-serif;background:#fef3d0;color:#283454}button{font:inherit;cursor:pointer;touch-action:manipulation}.wrap{max-width:980px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.top h1{font-size:clamp(23px,4vw,38px);color:#7647bc;margin:7px 0}.pill{background:white;border:3px solid #e2c1f9;border-radius:22px;padding:9px 13px;font-weight:900}.stage{height:clamp(335px,55vw,475px);border:6px solid white;border-radius:32px;position:relative;overflow:hidden;background:linear-gradient(#a1e8fb 0%,#ddfaff 70%,#8bdb98 70%);box-shadow:0 9px #e1d8ff}.cloud{position:absolute;top:13%;left:12%;width:135px;height:42px;background:white;border-radius:60px}.cloud:before,.cloud:after{content:'';position:absolute;background:white;width:60px;height:65px;left:14px;top:-30px;border-radius:50%}.cloud:after{left:62px;top:-36px}.cloud.c2{left:75%;top:24%;transform:scale(.75)}.sun{position:absolute;right:15%;top:8%;font-size:55px}.monster{position:absolute;width:clamp(205px,36vw,300px);height:clamp(225px,39vw,325px);bottom:6%;left:50%;transform:translateX(-50%);background:#a96add;border:8px solid #7142a9;border-radius:48% 48% 36% 36%;box-shadow:inset -18px -12px #854cbf,0 12px #5fa86c;transition:transform .25s}.monster.happy{animation:hop .5s 2}.monster.munch{animation:munch .25s 4}@keyframes hop{50%{transform:translateX(-50%) translateY(-32px) rotate(4deg)}}@keyframes munch{50%{transform:translateX(-50%) scale(1.06,.92)}}.horn{position:absolute;top:-40px;width:60px;height:90px;background:#f7b23a;border:6px solid #d58c26;border-radius:80% 20% 30% 20%;transform:rotate(-25deg);left:15%}.horn.right{left:auto;right:15%;transform:rotate(25deg) scaleX(-1)}.eyes{position:absolute;top:24%;left:12%;right:12%;display:flex;justify-content:space-around}.eye{background:white;border:5px solid #6538a3;width:68px;height:75px;border-radius:50%;display:grid;place-items:center}.eye:after{content:'';width:22px;height:28px;background:#202843;border-radius:50%;display:block}.mouth{position:absolute;bottom:18%;left:24%;width:52%;height:27%;background:#3d224f;border:7px solid #703a90;border-radius:15% 15% 50% 50%;overflow:hidden;display:flex;justify-content:space-evenly}.tooth{background:white;clip-path:polygon(0 0,100% 0,50% 100%);width:22%;height:36%}.cheek{position:absolute;top:52%;width:42px;height:21px;background:#e79bcc;border-radius:50%;left:5%}.cheek.right{left:auto;right:5%}.arm{position:absolute;top:55%;width:80px;height:38px;background:#9657cf;border:6px solid #7142a9;border-radius:30px;left:-55px;transform:rotate(25deg)}.arm.right{left:auto;right:-55px;transform:rotate(-25deg)}.speech{position:absolute;top:5%;left:50%;transform:translateX(-50%);z-index:4;background:white;border:4px solid #8057c9;border-radius:24px;padding:10px 18px;font-size:clamp(16px,3vw,25px);font-weight:1000;text-align:center;max-width:94%;box-shadow:0 6px #a9c9d5}.foodline{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:clamp(8px,2vw,19px);margin:18px auto}.food{width:clamp(61px,15vw,126px);height:clamp(83px,17vw,130px);border:4px solid #fff;border-bottom:8px solid #9d7f4d;border-radius:23px;background:#ffce72;font-size:clamp(36px,7vw,65px);font-weight:1000;color:#542f8c;box-shadow:0 4px 8px #63501b33;transition:transform .2s}.food:nth-child(2){background:#ffc0bf}.food:nth-child(3){background:#bbef94}.food:nth-child(4){background:#c8d8ff}.food:nth-child(5){background:#ffd5fb}.food:active{transform:scale(.9)}.food.wrong{animation:shake .3s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.food.correct{transform:scale(.15);opacity:0;pointer-events:none;transition:.5s}.panel{background:white;border:5px solid #eed9ff;border-radius:24px;padding:16px;text-align:center;margin-top:12px}.panel p{font-size:clamp(17px,3vw,23px);font-weight:800;margin:6px 0}.controls{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px}.control{border:0;border-bottom:5px solid #5370bd;background:#7da4ff;border-radius:17px;color:white;font-weight:900;padding:13px 20px;font-size:18px}.control.primary{background:#f8ad2e;border-color:#d88316;color:#5d3507}.feedback{min-height:35px;color:#6538a3;font-weight:1000;font-size:21px;margin-top:7px}.confetti{position:absolute;pointer-events:none;font-size:32px;animation:burst 1.2s forwards;z-index:7}@keyframes burst{to{translate:var(--x) -140px;opacity:0;rotate:120deg}}.foot{text-align:center;font-size:13px;color:#667086;margin-top:8px}@media(max-width:550px){.stage{height:360px}.monster{bottom:7%}.speech{top:3%}}
</style></head><body><main class="wrap"><header class="top"><h1>👾 Monstrinho das Vogais</h1><div class="pill">⭐ Acertos: <span id="score">0</span></div></header><section class="stage" id="stage"><div class="cloud"></div><div class="cloud c2"></div><div class="sun">☀️</div><div class="speech" id="speech">Olá! Vamos brincar?</div><div class="monster" id="monster"><div class="horn"></div><div class="horn right"></div><div class="arm"></div><div class="arm right"></div><div class="eyes"><div class="eye"></div><div class="eye"></div></div><div class="cheek"></div><div class="cheek right"></div><div class="mouth"><div class="tooth"></div><div class="tooth"></div><div class="tooth"></div></div></div></section><section class="panel"><p id="instruction">O monstrinho está com fome de letrinhas!</p><div class="foodline" id="letters"></div><div class="controls"><button class="control primary" id="start">▶️ COMEÇAR</button><button class="control" id="repeat">🔊 OUVIR DE NOVO</button><button class="control" id="mute">🔊 Som ligado</button></div><div class="feedback" id="feedback" aria-live="polite"></div></section><div class="foot">Para crianças de 3 anos • Sem tempo limite • Letras grandes para tocar</div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),names={A:'á',E:'é',I:'i',O:'ó',U:'u'};let voices=[],sound=true,started=false,locked=false,correct='A',score=0,round=0,timer=null;const getVoices=()=>{if('speechSynthesis'in window)voices=speechSynthesis.getVoices()};getVoices();if('speechSynthesis'in window)speechSynthesis.addEventListener('voiceschanged',getVoices);function speak(str){if(!sound||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const v=voices.find(x=>/^pt-BR$/i.test(x.lang))||voices.find(x=>/^pt/i.test(x.lang));const u=new SpeechSynthesisUtterance(str);u.lang='pt-BR';if(v)u.voice=v;u.rate=.76;u.pitch=1;speechSynthesis.speak(u)}catch(e){}}function soundfx(win){if(!sound)return;try{const a=new(window.AudioContext||window.webkitAudioContext)();[0,1,2].forEach(i=>{let o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=win?[500,660,880][i]:[230,190,170][i];g.gain.setValueAtTime(.001,a.currentTime+i*.11);g.gain.exponentialRampToValueAtTime(.12,a.currentTime+i*.11+.01);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+i*.11+.16);o.start(a.currentTime+i*.11);o.stop(a.currentTime+i*.11+.17)});setTimeout(()=>a.close(),700)}catch(e){}}function sayTask(){speak('Estou com fome! Me dê a letrinha '+names[correct]+'. Cadê a letra '+names[correct]+'?')}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function setRound(){locked=false;const arr='AEIOU';correct=arr[round%5];round++;$('letters').innerHTML='';for(const l of shuffle(arr.split(''))){const b=document.createElement('button');b.className='food';b.textContent=l;b.setAttribute('aria-label','Letra '+l);b.onclick=()=>pick(l,b);$('letters').append(b)}$('speech').textContent='Me dê a letra '+correct+'!';$('instruction').textContent='Toque na letrinha que o monstrinho pediu!';$('feedback').textContent='';$('start').style.display='none';sayTask()}function celebrate(){const symbols=['⭐','✨','💛','🌟'];for(let i=0;i<12;i++){let e=document.createElement('span');e.className='confetti';e.textContent=symbols[i%4];e.style.left=(20+Math.random()*60)+'%';e.style.top=(45+Math.random()*35)+'%';e.style.setProperty('--x',(Math.random()*320-160)+'px');$('stage').append(e);setTimeout(()=>e.remove(),1300)}}function pick(l,b){if(!started||locked)return;if(l!==correct){b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');$('feedback').textContent='💛 Tente outra vez!';soundfx(false);speak('Ops! Cadê a letra '+names[correct]+'?');return}locked=true;b.classList.add('correct');score++;$('score').textContent=score;$('monster').classList.add('munch');$('feedback').textContent='🎉 Muito bem!';$('speech').textContent='Que delícia! Parabéns!';celebrate();soundfx(true);setTimeout(()=>{$('monster').classList.remove('munch');$('monster').classList.add('happy');speak('Muito bem! Você encontrou a letra '+names[correct]+'!')},450);clearTimeout(timer);timer=setTimeout(()=>{$('monster').classList.remove('happy');setRound()},2600)}$('start').onclick=()=>{if(started)return;started=true;setRound()};$('repeat').onclick=()=>{if(started)sayTask();else speak('Olá! Vamos alimentar o monstrinho com as letrinhas? Aperte começar!')};$('mute').onclick=()=>{sound=!sound;$('mute').textContent=sound?'🔊 Som ligado':'🔇 Som desligado';if(!sound&&'speechSynthesis'in window)speechSynthesis.cancel()};})();
</script></body></html>
