<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roleta das Vogais 🎡</title>
<style>
:root{font-family:ui-rounded,'Trebuchet MS',Arial,sans-serif;color:#283353;--purple:#7258e8;--pink:#ff6a9b;--mint:#33bd9c;--yellow:#ffca4d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 12%,#fff7bd 0 9%,transparent 10%),radial-gradient(circle at 89% 23%,#ffd8eb 0 10%,transparent 11%),linear-gradient(145deg,#dff7ff,#f3ebff 55%,#ffe7cf);display:flex;justify-content:center;align-items:center;padding:18px;overflow-x:hidden}main{width:min(100%,980px);border:5px solid #fff;background:#ffffffdb;border-radius:36px;box-shadow:0 18px 50px #69749d38;padding:24px;text-align:center;position:relative;min-height:620px}h1{font-size:clamp(27px,5vw,46px);margin:4px 0 8px;color:#5b48c7;text-shadow:2px 3px #eee7ff}h2{font-size:clamp(22px,3.8vw,34px);margin:10px 0}.subtitle{font-size:clamp(17px,2.5vw,23px);margin:5px auto 14px;font-weight:700}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.score{border-radius:24px;background:#fff1b8;padding:10px 16px;font-size:17px;font-weight:900;border:2px solid #ffdf75}.mute{background:#fff;border:2px solid #d7d9f9;border-radius:20px;font-size:25px;min-width:52px;height:50px;cursor:pointer}.wheel-wrap{position:relative;width:min(76vw,420px);height:min(76vw,420px);margin:8px auto 16px;filter:drop-shadow(0 12px 8px #57478335)}canvas{display:block;width:100%;height:100%;border-radius:50%;background:#fff;border:9px solid white;box-shadow:0 0 0 7px #8273e9}.pointer{position:absolute;top:-19px;left:50%;transform:translateX(-50%);z-index:3;width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:42px solid #eb426c;filter:drop-shadow(0 3px 1px #8b2868)}.hub{position:absolute;inset:43%;background:#fff;border:7px solid #ffe06f;border-radius:50%;pointer-events:none;box-shadow:0 2px 5px #9997}.primary{border:0;border-radius:26px;padding:17px 45px;background:linear-gradient(120deg,#ff638b,#ff9a48);box-shadow:0 7px 0 #d64f64;color:#fff;font-weight:1000;font-size:clamp(21px,3vw,27px);cursor:pointer;touch-action:manipulation}.primary:active{transform:translateY(5px);box-shadow:0 2px 0 #d64f64}.primary:disabled{opacity:.6;cursor:wait}.game{display:none}.game.active{display:block}.question-figure{font-size:clamp(100px,20vw,175px);background:linear-gradient(135deg,#fff6d8,#e6f9ff);border:5px dashed #e5c963;border-radius:35px;width:min(310px,75vw);height:225px;display:grid;place-items:center;margin:17px auto 5px;animation:pop .4s ease}.choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:25px auto 15px;max-width:700px}.vowel{width:clamp(74px,15vw,113px);height:clamp(83px,15vw,120px);border:0;border-radius:26px;background:#fff;color:#5845ad;box-shadow:0 8px 0 #c8c2eb,inset 0 0 0 4px #e2dcff;font-size:clamp(40px,8vw,67px);font-weight:1000;cursor:pointer;touch-action:manipulation}.vowel:active{transform:translateY(5px)}.vowel.correct{background:#b9f8d9;box-shadow:0 7px 0 #62c99a;color:#08794e}.vowel.wrong{background:#ffd1d9;box-shadow:0 7px 0 #ec92a0;color:#a62947;animation:shake .3s}.feedback{min-height:60px;font-size:clamp(20px,3vw,28px);font-weight:900;margin:18px auto 8px}.success{color:#128660}.tryagain{color:#bd4671}.small{color:#6a718e;font-size:16px;font-weight:700}.next{background:linear-gradient(120deg,#4ccaa4,#37aad5);box-shadow:0 7px 0 #288ba2;display:none;margin:auto}.next:active{box-shadow:0 2px 0 #288ba2}.hidden{display:none!important}.footer{font-size:13px;color:#8a8ca8;margin-top:18px}@keyframes pop{from{transform:scale(.8)}to{transform:scale(1)}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@media(max-width:550px){body{padding:8px}main{padding:15px 10px;min-height:0;border-radius:24px}.wheel-wrap{width:min(77vw,345px);height:min(77vw,345px)}.score{font-size:14px;padding:9px}.question-figure{height:180px}.choices{gap:8px}.vowel{width:17vw;height:84px;border-radius:17px;font-size:45px}.pointer{top:-17px}}
</style>
</head>
<body>
<main>
 <div class="top"><div class="score" id="score">⭐ Acertos: 0</div><button class="mute" id="mute" aria-label="Ativar ou desativar som">🔊</button></div>
 <section id="spinScreen" class="game active">
  <h1>🎡 Roleta das Vogais</h1><p class="subtitle">Gire a roleta e descubra a figura!</p>
  <div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel" width="640" height="640" aria-label="Roleta com figuras"></canvas><div class="hub"></div></div>
  <button class="primary" id="spin">🎲 GIRAR ROLETA!</button><p class="small" id="spinHint">Toque no botão para começar!</p>
 </section>
 <section id="quizScreen" class="game">
  <h1>🌈 Descubra a Vogal!</h1><h2>Qual vogal começa o nome desta figura?</h2>
  <div class="question-figure" id="figure" role="img" aria-label="Figura sorteada"></div>
  <p class="subtitle" id="prompt">Olhe bem e escolha uma vogal!</p>
  <div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div>
  <button class="primary next" id="next">🎡 GIRAR NOVAMENTE</button>
 </section>
 <div class="footer">Aprender brincando • A E I O U</div>
</main>
<script>
(()=>{
'use strict';
const items=[
 {name:'Abelha',emoji:'🐝',v:'A'}, {name:'Elefante',emoji:'🐘',v:'E'},
 {name:'Igreja',emoji:'⛪',v:'I'}, {name:'Ovo',emoji:'🥚',v:'O'},
 {name:'Uva',emoji:'🍇',v:'U'}, {name:'Avião',emoji:'✈️',v:'A'},
 {name:'Estrela',emoji:'⭐',v:'E'}, {name:'Ilha',emoji:'🏝️',v:'I'},
 {name:'Olho',emoji:'👁️',v:'O'}, {name:'Urso',emoji:'🐻',v:'U'}
];
const colors=['#ffacbe','#8de6c8','#ffdb72','#9dbef9','#d6b4ff','#ffb77e','#a5e6ec','#ffc1e2','#b3e3a0','#cbc3fd'];
const $=id=>document.getElementById(id), canvas=$('wheel'),ctx=canvas.getContext('2d'), TAU=2*Math.PI,n=items.length,step=TAU/n;
let angle=0,busy=false,current=null,solved=false,score=0,sound=true,ac=null,lastIndex=-1;
function draw(){const c=320,r=305;ctx.clearRect(0,0,640,640);for(let i=0;i<n;i++){const start=angle+i*step-Math.PI/2-step/2,mid=start+step/2;ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,r,start,start+step);ctx.closePath();ctx.fillStyle=colors[i];ctx.fill();ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.stroke();ctx.save();ctx.translate(c+Math.cos(mid)*204,c+Math.sin(mid)*204);ctx.rotate(mid+Math.PI/2);ctx.font='80px "Segoe UI Emoji","Apple Color Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(items[i].emoji,0,0);ctx.restore()}ctx.beginPath();ctx.arc(c,c,55,0,TAU);ctx.fillStyle='#fff';ctx.fill();ctx.beginPath();ctx.arc(c,c,44,0,TAU);ctx.fillStyle='#ffe171';ctx.fill();ctx.font='bold 47px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#6b54d6';ctx.fillText('★',c,c+2)}
function tone(freq,duration=.13,type='sine',delay=0){if(!sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.09,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+duration+.02)}catch(e){}}
function speak(text){if(!sound||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='pt-BR';u.rate=.79;u.pitch=1.16;const voices=speechSynthesis.getVoices();const pt=voices.find(v=>v.lang.toLowerCase()==='pt-br');if(pt)u.voice=pt;speechSynthesis.speak(u)}catch(e){}}
function switchTo(id){$('spinScreen').classList.toggle('active',id==='spinScreen');$('quizScreen').classList.toggle('active',id==='quizScreen')}
function playSpin(){if(busy)return;busy=true;$('spin').disabled=true;$('spinHint').textContent='🎉 A roleta está girando!';tone(580,.12);const options=items.map((_,i)=>i).filter(i=>i!==lastIndex),idx=options[Math.floor(Math.random()*options.length)];lastIndex=idx;const targetMod=((n-idx)*step)%TAU;const normalized=((angle%TAU)+TAU)%TAU;let delta=(targetMod-normalized+TAU)%TAU;delta+=TAU*6;const from=angle,start=performance.now(),duration=4250;function frame(now){const t=Math.min(1,(now-start)/duration),e=1-Math.pow(1-t,4);angle=from+delta*e;draw();if(t<1){requestAnimationFrame(frame)}else{angle=targetMod;draw();current=items[idx];busy=false;$('spin').disabled=false;showQuestion()}}requestAnimationFrame(frame)}
function showQuestion(){solved=false;$('figure').textContent=current.emoji;$('figure').setAttribute('aria-label',current.name);$('prompt').textContent='Qual é a primeira vogal?';$('feedback').textContent='';$('feedback').className='feedback';$('next').style.display='none';$('choices').innerHTML='';for(const v of 'AEIOU'){const b=document.createElement('button');b.className='vowel';b.textContent=v;b.setAttribute('aria-label','Vogal '+v);b.addEventListener('click',()=>answer(v,b));$('choices').appendChild(b)}switchTo('quizScreen');tone(660,.11);tone(880,.2,'sine',.11);setTimeout(()=>speak('Que figura é esta? '+current.name+'. Qual é a vogal inicial?'),350)}
function answer(v,b){if(solved)return;if(v===current.v){solved=true;score++;$('score').textContent='⭐ Acertos: '+score;b.classList.add('correct');document.querySelectorAll('.vowel').forEach(btn=>btn.disabled=true);$('feedback').textContent='🎉 Parabéns! '+current.name+' começa com '+v+'!';$('feedback').className='feedback success';$('prompt').textContent=current.v+' de '+current.name+'!';$('next').style.display='block';tone(523,.15);tone(659,.15,'sine',.17);tone(784,.3,'sine',.34);setTimeout(()=>speak('Muito bem! '+current.name+' começa com a letra '+v+'.'),520)}else{b.classList.add('wrong');$('feedback').textContent='💗 Tente outra vogal!';$('feedback').className='feedback tryagain';tone(260,.22,'triangle');setTimeout(()=>b.classList.remove('wrong'),600);setTimeout(()=>speak('Tente outra vez!'),220)}}
$('spin').addEventListener('click',playSpin);$('next').addEventListener('click',()=>{switchTo('spinScreen');$('spinHint').textContent='Vamos descobrir outra figura!'});$('mute').addEventListener('click',()=>{sound=!sound;$('mute').textContent=sound?'🔊':'🔇';if(!sound&&'speechSynthesis'in window)speechSynthesis.cancel()});draw();
})();
</script>
</body>
</html>
